version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sekarpura_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sekarpura_election
    volumes:
      - mongo_data:/data/db
    networks:
      - sekarpura_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sekarpura_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/sekarpura_election
      JWT_SECRET: super_secret_sekarpura_jwt_key_2026_halimperdanakusuma
      JWT_EXPIRES_IN: 1d
      REFRESH_TOKEN_SECRET: super_secret_sekarpura_refresh_key_2026_halim
      CORS_ORIGIN: http://localhost:5173
      ADMIN_DEFAULT_EMAIL: admin@sekarpura-halim.org
      ADMIN_DEFAULT_PASSWORD: AdminSekarpura2026!
    volumes:
      - ./uploads:/uploads
    depends_on:
      - mongodb
    networks:
      - sekarpura_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sekarpura_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sekarpura_network

volumes:
  mongo_data:
    driver: local

networks:
  sekarpura_network:
    driver: bridge
